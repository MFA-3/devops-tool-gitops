apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-frontend
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-frontend
  template:
    metadata:
      labels:
        app: cloud-frontend
    spec:
      containers:
      - name: frontend
        image: farhan4hmed/cloud-frontend:v1
        ports:
        - containerPort: 4300
